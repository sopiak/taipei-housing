<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>台北市看房清單</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--sub:#5b6577;--line:#e2e6ee;--accent:#2563eb;--warn:#b45309;--ok:#15803d;--bad:#b91c1c;--chip:#eef2fb;--c0:#d9382f;--c1:#2563eb;--c2:#16a34a;--c3:#d99a00}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b1f27;--text:#e8ebf1;--sub:#a0a9ba;--line:#2c323e;--accent:#7aa2ff;--warn:#f0b35c;--ok:#5fd08a;--bad:#ff8a80;--chip:#262c3a}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:56px}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65;font-size:15px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:.92em}
header{padding:28px 16px 12px;max-width:1500px;margin:0 auto}
h1{margin:0 0 6px;font-size:1.8rem}
.sub{color:var(--sub);margin:0}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px 48px}
nav{position:sticky;top:0;z-index:900;background:var(--bg);border-bottom:1px solid var(--line)}
nav .in{max-width:1500px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;overflow-x:auto;white-space:nowrap}
nav a{background:var(--chip);color:var(--text);padding:4px 12px;border-radius:999px;font-size:.88rem;flex:none}
.callout{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin:12px 0}
.callout b{display:block;margin-bottom:4px}
section.blk{margin:22px 0}
h2{font-size:1.3rem;margin:0 0 10px}
details.fold{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";color:var(--sub);font-weight:400}
details.fold[open]>summary::after{content:"－"}
details.fold>.body{padding:4px 16px 16px;border-top:1px solid var(--line)}
details.fold details.fold{box-shadow:none;margin:12px 0}
details.fold details.fold>summary{font-size:1rem}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
.metric{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.metric .v{font-size:1.6rem;font-weight:700}.metric .l{color:var(--sub);font-size:.85rem}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.filters label{font-size:.78rem;color:var(--sub);display:flex;flex-direction:column;gap:3px}
select,input[type=search],button.btn{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);min-height:38px}
button.btn{cursor:pointer}button.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:780px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cards{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:1.05rem;line-height:1.35}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.badge{background:var(--chip);border-radius:999px;padding:1px 9px;font-size:.78rem;color:var(--sub)}
.badge.new{background:#d9382f;color:#fff;font-weight:700}.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--bad)}
dl.facts{margin:0;display:grid;grid-template-columns:5.2em 1fr;gap:3px 8px;font-size:.9rem}
dl.facts dt{color:var(--sub)}dl.facts dd{margin:0;word-break:break-word}
.card details{font-size:.88rem}.card details summary{cursor:pointer;color:var(--accent)}
.card details p{margin:6px 0}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;margin-top:auto}
.marks{display:flex;gap:6px;flex-wrap:wrap}
.marks button{font:inherit;font-size:.82rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.marks button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.marks button.on.s2{background:var(--ok);border-color:var(--ok)}.marks button.on.s3{background:var(--sub);border-color:var(--sub)}

.fgt{font-size:.8rem;color:var(--sub);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.85rem;padding:5px 12px;min-height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.fnote{margin:0 0 6px}
table{border-collapse:collapse;width:100%;table-layout:auto;font-size:.78rem;line-height:1.45;background:var(--card)}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
th{background:var(--chip)}
td .marks button{padding:2px 7px;font-size:.74rem}

tr:last-child td{border-bottom:none}
#map{height:62vh;min-height:360px;border-radius:12px;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0;font-size:.9rem}
.legend label{display:flex;align-items:center;gap:6px;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid var(--c);background:var(--c)}
.dot.h{background:transparent}
.pin{width:26px;height:26px;border-radius:50%;border:3px solid var(--c);color:#fff;background:var(--c);font:700 11px/20px system-ui;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.approx{background:rgba(255,255,255,.9);color:#222;border-style:dashed}
.pop{font-size:13px;line-height:1.5;min-width:210px}.pop b{font-size:14px}.pop .ap{color:#b45309}
.pop .marks button{color:#222;background:#fff}
ul.b{padding-left:1.2em;margin:8px 0}ul.b li{margin:3px 0}
.linkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin:10px 0;font-size:.9rem}
.linkgrid a{display:block;background:var(--chip);border-radius:8px;padding:8px 10px;color:var(--text)}
.linkgrid a small{display:block;color:var(--sub)}
.note{color:var(--sub);font-size:.88rem}
footer{max-width:1500px;margin:0 auto;padding:0 16px 40px;color:var(--sub);font-size:.85rem}
.circ{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;background:var(--bg)}
.circ h4{margin:0 0 6px;font-size:1rem}

.copyrow{margin-top:4px}.copyrow .copyb{min-height:44px;padding:8px 18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;font-size:.95rem;z-index:3000;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#copyBox{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2500;display:flex;align-items:center;justify-content:center;padding:16px}
#copyBox .cbin{background:var(--card);color:var(--text);border-radius:12px;padding:16px;width:100%;max-width:520px}

@media (max-width:600px){h1{font-size:1.45rem}#map{height:55vh}}
.badge.bad{background:#fde2e1;color:#a4161a;border-color:#f5a3a0;font-weight:700}
.src{font-size:.78rem;word-break:break-all}
</style>
</head>

達麗河藴實登車位約 280–340 萬）"]]}, {"t": "text", "v": "推算方式為（預算減車位）除以各區中位單價，是粗略估算，實際依路段與產品而異。以預售 3 房常見總價來看，大安 9,063 萬已遠超過 6,000 萬，在大安 6,000 萬以內大多只買得到 36 坪左右的新成屋，或是屋齡較高的中古屋；士林 4,520 萬與北投 4,989 萬仍在預算內，可以挑較大坪數或較新的案子。"}]}, {"h": "高價住宅（豪宅）貸款規定與 6,000 萬預算", "c": [{"t": "table", "cols": ["項目", "現行規定", "來源"], "rows": [["認定門檻", "建物權狀含「住」字，且台北市住宅鑑價或買賣金額達 7,000 萬元以上（新北市 6,000 萬元、其他地區 4,000 萬元）", {"u": "https://www.law.cbc.gov.tw/ELaw/ShowAllPrint?LawID=LA03B026013&SerialNumber=True", "l": "央行法規資料庫：不動產抵押貸款業務規定"}], ["貸款成數上限", "自然人購置高價住宅貸款為 3 成、不得有寬限期；2026-09-18 修正後維持不變", {"u": "https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html", "l": "央行 2026-09-17 理監事會新聞稿（修正對照表）"}], ["計算基準", "住宅（含基地）鑑價或買賣金額兩者取較低者；不得另以修繕、周轉金或其他名目增加貸款", {"u": "https://www.cbc.gov.tw/tw/cp-4223-124873-79d4c-1.html", "l": "央行問與答（115.9.18 生效版）"}], ["車位是否計入", "條文只寫「住宅（含基地）鑑價或買賣金額」，沒有明列車位是否計入，本輪也沒找到央行對此的官方說明，請向銀行確認。台北市房屋稅的「高級住宅」是另一套制度（房地總價 8,000 萬含車位，臺北市房屋標準價格作業要點），不等於央行豪宅貸款", {"u": "https://www.ey.com/zh_tw/insights/tax/pcs-potential-risks-of-luxury-property-investment", "l": "安永：投資豪宅的潛在隱憂"}], ["最新修正日期", "央行 2026-09-17 理監事會修正本規定，2026-09-18 生效，修正內容為第 2 戶購屋貸款 6 成調升為 7 成、購地貸款刪除切結動工；高價住宅條件維持不變。央行法規資料庫頁面顯示的前一次修正為 2026-03-19（2026-03-20 生效），本輪未查到 7,000 萬門檻最後一次調整的日期", {"u": "https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html", "l": "央行新聞稿"}]]}, {"t": "bullets", "v": ["6,000 萬低於台北市 7,000 萬的門檻，相差 1,000 萬，所以以買賣金額來看不是高價住宅、不受 3 成上限，仍受自然人第 1、2、3 戶規定（名下有房屋的第 1 戶無寬限期，第 2 戶最高 7 成，第 3 戶以上 3 成，央行對照表）。", "6,000–6,500 萬的「略超、可議價」仍低於 7,000 萬；但鑑價或買賣金額任一個達 7,000 萬就會被認定為高價住宅，所以越接近 7,000 萬，越要先請銀行確認鑑價。", "若為高價住宅，以成交價與鑑價相同估算：7,000 萬最高貸 2,100 萬、自備款至少 4,900 萬；1 億最高貸 3,000 萬、自備款至少 7,000 萬（money101 試算）。", "青安貸款在台北市限房價 3,500 萬以下，不適用本清單預算（money101）。", "這是我整理的規定摘要，不是法律意見，實際核貸成數仍依銀行審核。"]}, {"t": "links", "v": [{"title": "央行法規資料庫：不動產抵押貸款業務規定（高價住宅定義）", "site": "law.cbc.gov.tw", "href": "https://www.law.cbc.gov.tw/ELaw/ShowAllPrint?LawID=LA03B026013&SerialNumber=True"}, {"title": "央行問與答（115.9.18 生效版）", "site": "cbc.gov.tw", "href": "https://www.cbc.gov.tw/tw/cp-4223-124873-79d4c-1.html"}, {"title": "央行 2026-09-17 理監事會新聞稿", "site": "cbc.gov.tw", "href": "https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html"}, {"title": "money101：2026 豪宅貸款成數與限貸令", "site": "money101.com.tw", "href": "https://www.money101.com.tw/blog/%E8%B1%AA%E5%AE%85%E8%B2%B8%E6%AC%BE%E6%88%90%E6%95%B8"}]}]}, {"h": "近期趨勢：利率、信用管制、交易量", "c": [{"t": "bullets", "v": ["央行 2026-09-17 理監事會維持重貼現率 2%，連續第十季不變（央行新聞稿、中央社）。", "信用管制自 2026-09-18 起放寬：自然人第 2 戶購屋貸款成數上限由 6 成升至 7 成，購地貸款刪除須切結動工的規定；高價住宅、第 3 戶以上購屋貸款仍為 3 成（央行對照表）。", "五大銀行 2026 年 9 月新承做購屋貸款平均利率 2.315%（8 月 2.321%），同期青安貸款占比 43.1%（央行、工商時報）。", "一般銀行公開房貸方案約 2.45% 起，廣告最低利率有客群限制（money101）。", "青安 3.0 在台北市限房價 3,500 萬以下，不適用於本清單多數物件（money101）。", "台北市建物買賣移轉第三季 6,237 棟、年增 12.3%；9 月 2,133 棟、月增 21.7%、年增 20.2%；前三季 18,225 棟、年增 5.3%（工商時報、聯合新聞網）。", "永慶房屋預期後續為量小增價平，房貸利率仍在高檔（工商時報）。", "北投預售屋受輝達總部效應帶動，月均成交 84 件、平均 112.8 萬/坪，北士科重劃區內約 130–150 萬/坪，專家預期短期進入高檔盤整（工商時報）。"]}, {"t": "links", "v": [{"title": "央行理監事會決議新聞稿（2026-09-17）", "site": "cbc.gov.tw", "href": "https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html"}, {"title": "央行：金融統計（新承做購屋貸款利率）", "site": "cbc.gov.tw", "href": "https://www.cbc.gov.tw/tw/cp-528-1079-B4682-1.html"}, {"title": "中央社：央行利率連 10 凍，第 2 戶放寬至 7 成", "site": "cna.com.tw", "href": "https://www.cna.com.tw/news/afe/202609170242.aspx"}, {"title": "工商時報：五大銀行 9 月新增房貸回溫", "site": "ctee.com.tw", "href": "https://www.ctee.com.tw/news/20261023700169-439901"}, {"title": "工商時報：9 月六都買賣移轉回穩", "site": "ctee.com.tw", "href": "https://www.ctee.com.tw/news/20261001702049-430503"}, {"title": "聯合新聞網：六都房市築底回溫", "site": "udn.com", "href": "https://udn.com/news/story/7241/9788608"}, {"title": "money101：2026 房貸利率與青安 3.0", "site": "money101.com.tw", "href": "https://www.money101.com.tw/blog/%E6%88%BF%E8%B2%B8%E5%88%A9%E7%8E%87"}, {"title": "工商時報：輝達效應 北投預售屋均價 112.8 萬", "site": "ctee.com.tw", "href": "https://www.ctee.com.tw/news/20261021700105-439901"}]}]}, {"h": "預售屋與新古屋怎麼取捨", "c": [{"t": "table", "cols": ["項目", "預售屋", "新古屋（含新成屋）"], "rows": [["單價", "預售中位較高：大安 187.0、士林 112.1、北投 110.6 萬/坪", "新成屋中位較低：大安 156.1、士林 105.1、北投 93.6 萬/坪；比預售低約 17%、6%、15%（我用 ToEstate 數字推算）"], ["入住時間", "清單中完工在 2026 Q4 到 2031 年", "可立即入住；新成屋多為隨時交屋"], ["價格透明度", "實登是過往成交價、不是現價；開價常待定", "刊登頁直接有總價與議價價（永慶、信義列表）"], ["格局與屋況", "可挑樓層，有客變機會；交屋要驗屋，保留房地總價 5% 至修繕完成", "屋況可實看；仍要驗漏水、管線與社區管理"], ["車位", "建案頁有車位數與配比，平面或機械可比較", "逐戶確認車位形式、是否含在總價"], ["選擇", "同案可選多種坪數", "預算內的 3 房多是仲介釋出戶，需逐一確認屋齡與車位"]]}]}, {"h": "看房檢查重點", "c": [{"t": "bullets", "v": ["公設比：30% 以下較佳，35% 以上要確認公設是否實用；清單中昇陽醴居 28.8%、統創翼 36%。", "車位形式：確認平面或機械、坡道或升降、車位尺寸、產權與維修費；機械車位要比對車長、寬、高與載重。清單例：碧湖雲景機械式 133 個多於平面式 111 個，天母知鈺為塔式且登記公設。", "建商口碑：查過往完工口碑、訴訟與財務，並確認履約保證。", "客變與驗屋：客變先看格局與水電；交屋驗門窗、牆地、水電、排水與防水，瑕疵寫入驗收單，修好複驗前保留房地總價 5%。", "實價比對：用內政部實價登錄的預售屋查詢與預售屋建案查詢，核對建照、起造人與同建案成交單價；資料每月 1、11、21 日更新，應比較多筆。", "車位另列的案子要把車位價加回總價再比預算，例如大安德運安和實登車位約 400–510 萬。"]}, {"t": "links", "v": [{"title": "預售屋簽約注意事項 2026（建照、車位、保固）", "site": "applealmondrealty.com", "href": "https://applealmondrealty.com/posts/29525"}, {"title": "預售屋車位怎麼選？平面、機械、升降式差異", "site": "appi.news", "href": "https://appi.news/articles/presale-parking-space-guide/"}, {"title": "新建案購屋指南：評估建商與公設比", "site": "myhousing.com.tw", "href": "https://www.myhousing.com.tw/p/p07/269480/"}, {"title": "預售屋怎麼買才不踩雷：建商背景、客變、驗屋", "site": "twprobe.com", "href": "https://twprobe.com/blog/presale-house-buying-safety-guide"}, {"title": "預售屋驗屋清單", "site": "wbmode.com", "href": "https://wbmode.com/guide/presale-inspection-checklist/"}, {"title": "內政部不動產交易實價查詢服務網", "site": "lvr.land.moi.gov.tw", "href": "https://lvr.land.moi.gov.tw/"}]}]}]}, "mark": {"h": "標記與更新方式", "c": [{"t": "text", "v": "「想看／已看／不考慮」標記可直接在卡片、表格或地圖標記的視窗中點選，會存在這個瀏覽器的 localStorage，只留在這台裝置：換手機或電腦不會同步，清除瀏覽器資料就會消失。再點一次同一個按鈕可取消標記。"}, {"t": "bullets", "v": ["預算欄：符合代表已知總價（含車位）在約 6,000 萬以內；略超、可議價代表開價在 6,000–6,500 萬或議價後可到 6,000 萬內；部分符合代表只有部分房型或條件（例如屋齡略超過 15 年）符合；待確認代表總價尚未公開。", "標示為估算的總價，是我用開價乘以坪數算出，不含車位，僅供粗略比較。", "預售建案的實價登錄成交價是過去成交，不等於現在牌價。"]}]}, "sources": {"h": "資料來源與限制", "c": [{"t": "bullets", "v": ["591 新建案列表頁被擋（403），只能讀到搜尋 function getMark(n){if(Object.prototype.hasOwnProperty.call(marks,n))return marks[n]||0;return DEFAULT_MARKS[n]||0;}
function toggleMark(n,s){
  if(getMark(n)===s){if(Object.prototype.hasOwnProperty.call(DEFAULT_MARKS,n))marks[n]=0;else delete marks[n];}
  else marks[n]=s;
  try{localStorage.setItem(KEY,JSON.stringify(marks));}catch(err){}
}

var items=[];

D.refs.forEach(function(x){items.push(Object.assign({kind:'ref'},x));});
D.others.forEach(function(x){items.push(Object.assign({kind:'other'},x));});

var OVER=items.filter(function(i){return i.kind==='over';});
function ageNum(it){
  var m=/屋齡約?\s*([\d.]+)/.exec(it.age||'');
  if(m)return parseFloat(m[1]);
  if(/^0 年/.test(it.age||''))return 0;
  if(it.t==='預售')return -1;
  return null;
}
function ageBucket(it){var a=ageNum(it);if(a===null)return '未列';if(a<0)return '預售（未入住）';if(a<5)return '0–5 年';if(a<10)return '5–10 年';if(a<=15)return '10–15 年';return '超過 15 年';}
function priceBucket(it){var p=it.pmin;if(p==null)return '總價未列';if(p<=4000)return '4,000 萬以下';if(p<=5000)return '4,000–5,000 萬';if(p<=6000)return '5,000–6,000 萬';return '6,000 萬以上';}
function fitCls(f){return f==='符合'?'ok':f==='超出預算'?'bad':'warn';}
function typeLabel(t){return t==='預售'?'預售建案':t==='新成屋'?'新成屋':'新古屋';}

// ---- marks ----
function markBtns(it){
  return '<div class="marks">'+[1,2,3].map(function(s){return '<button type="button" class="s'+s+(getMark(it.n)===s?' on':'')+'" data-mark-id="'+it.id+'" data-mark-s="'+s+'">'+MS[s]+'</button>';}).join('')+'</div>';
}
function pad(n){return n<10?'0'+n:''+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function marksText(){
  var seen={},groups={1:[],2:[],3:[]},total=0;
  items.forEach(function(it){
    var s=getMark(it.n);if(!s||!groups[s])return;
    var label=it.n;if(seen[label]){label=it.n+'（#'+(it.id+1)+'）';}seen[it.n]=true;
    groups[s].push(label);total++;
  });
  if(!total)return '';
  return '我的看房標記（'+todayStr()+'）\n'+[1,2,3].map(function(s){return MS[s]+'：'+(groups[s].length?groups[s].join('、'):'（無）');}).join('\n');
}
var toastT=null;
function toast(msg){
  var el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el);}
  el.textContent=msg;el.className='show';clearTimeout(toastT);toastT=setTimeout(function(){el.className='';},3200);
}
function showCopyBox(text){
  var old=document.getElementById('copyBox');if(old)old.remove();
  var w=document.createElement('div');w.id='copyBox';
  w.innerHTML='<div class="cbin"><p><b>請手動複製以下文字</b>（已自動全選；手機請長按文字框選「拷貝」），再貼給找房小幫手。</p><textarea readonly rows="8"></textarea><div class="row"><button type="button" class="btn on" data-cb="sel">全選</button><button type="button" class="btn" data-cb="close">關閉</button></div></div>';
  document.body.appendChild(w);
  var ta=w.querySelector('textarea');ta.value=text;ta.focus();ta.select();
  w.addEventListener('click',function(e){var c=e.target.getAttribute&&e.target.getAttribute('data-cb');if(c==='close'||e.target===w)w.remove();if(c==='sel'){ta.focus();ta.select();}});
}
function copyMarks(){
  var text=marksText();
  if(!text){toast('還沒有標記');return;}
  var done=function(){toast('已複製標記，貼給找房小幫手即可');};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){
      navigator.clipboard.writeText(text).then(done,function(){showCopyBox(text);});
    }else{showCopyBox(text);}
  }catch(err){showCopyBox(text);}
}
window.__marksText=marksText;
document.addEventListener('click',function(e){
  if(e.target.closest&&e.target.closest('[data-copy-marks]')){e.preventDefault();copyMarks();return;}
  var b=e.target.closest&&e.target.closest('[data-mark-id]');
  if(b){var it=items[+b.getAttribute('data-mark-id')],s=+b.getAttribute('data-mark-s');
    toggleMark(it.n,s);
    renderList();renderPicks();refreshPopup(it);return;}
  var f=e.target.closest&&e.target.closest('[data-focus-id]');
  if(f){e.preventDefault();focusItem(items[+f.getAttribute('data-focus-id')]);}
});

function facts(rows){return '<dl class="facts">'+rows.filter(function(r){return r[1];}).map(function(r){return '<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>';}).join('')+'</dl>';}
function mapLink(it){
  if(!it.geo)return '';
  return '<a href="'+esc(gmu(it.geo))+'" target="_blank" rel="noopener noreferrer">在 Google 地圖開啟'+(it.geo.exact?'':'（大約）')+'</a><a href="#map" data-focus-id="'+it.id+'">在上方地圖看</a>';
}
function BI(it){return (D.builders||{})[it.n];}
function warnBadge(it){var x=BI(it);return x&&x.w?'<span class="badge bad" title="'+esc(x.i)+'">⚠️ 注意</span>':'';}
function builderLine(it){var x=BI(it);return x?'建商 '+x.b+'／營造 '+x.c:'';}
function builderMore(it){var x=BI(it);if(!x)return '';return '<p><b>建商／營造：</b>'+esc(x.b)+'／'+esc(x.c)+'</p><p><b>建商評價：</b>'+esc(x.r)+'</p><p><b>'+(x.w?'⚠️ ':'')+'特殊問題：</b>'+esc(x.i)+'</p><p class="src">查證來源：'+x.s.map(function(u,k){return A(u,'['+(k+1)+'] '+u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0]);}).join(' ')+'</p>';}
function card(it,showMark){
  var b=[];
  if(it.isNew)b.push('<span class="badge new">新</span>');
  if(warnBadge(it))b.push(warnBadge(it));
  b.push('<span class="badge">'+esc(it.d)+'</span>');
  if(it.kind==='main'){b.push('<span class="badge">'+typeLabel(it.t)+'</span>');b.push('<span class="badge '+fitCls(it.fit)+'">'+esc(it.fit)+'</span>');if(D.circleOf[it.n])b.push('<span class="badge">'+esc(D.circleOf[it.n])+'</span>');}
  if(it.kind==='ref')b.push('<span class="badge">'+esc(it.kind2)+'</span>');
  if(it.kind==='other')b.push('<span class="badge '+(/^符合/.test(it.fit)?'ok':'warn')+'">'+esc(it.fit)+'</span>');
  if(it.geo&&!it.geo.exact)b.push('<span class="badge warn">大約位置</span>');
  var f=[['路段',it.r],['總價',it.price]];
  if(it.kind==='main')f.push(['單價',it.unit]);
  f.push(['格局',it.size],['屋齡／完工',it.age],['車位',it.park],['建商／營造',BI(it)?BI(it).b+'／'+BI(it).c:''],['首次發現',it.found]);
  var more='';
  if(it.kind==='main')more='<p><b>亮點：</b>'+esc(it.hi)+'</p><p><b>疑慮：</b>'+esc(it.con)+'</p>';
  else if(it.kind==='ref')more='<p><b>為何值得看：</b>'+esc(it.why)+'</p><p><b>疑慮：</b>'+esc(it.con)+'</p>';
  else if(it.kind==='other')more='<p><b>推薦理由：</b>'+esc(it.why)+'</p><p><b>疑慮：</b>'+esc(it.con)+'</p>';
  return '<article class="card"><h3>'+esc(it.n)+'</h3><div class="badges">'+b.join('')+'</div>'+facts(f)+'<details><summary>亮點與提醒'+(BI(it)&&BI(it).w?'（⚠️ 有重要提醒）':'')+'</summary>'+more+builderMore(it)+'</details>'+
    (showMark===false?'':markBtns(it))+'<div class="links">'+A(it.url,'來源：'+it.src)+(it.alt||[]).map(function(a){return A(a.u,'另見：'+a.l);}).join('')+mapLink(it)+'</div></article>';
}
function tableOf(cols,rows){
  return '<div class="tw"><table class="rt"><thead><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i===0?' class="n"':'')+' data-label="'+esc(cols[i])+'">'+(c&&c.u?A(c.u,c.l):(c&&c.html!==undefined?c.html:md(c)))+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
}
function bullets(a){return '<ul class="b">'+a.map(function(x){return '<li>'+md(x)+'</li>';}).join('')+'</ul>';}
function links(a){return '<div class="linkgrid">'+a.map(function(l){return '<a href="'+esc(l.href)+'" target="_blank" rel="noopener noreferrer">'+esc(l.title)+'<small>'+esc(l.site||'')+'</small></a>';}).join('')+'</div>';}
function fold(title,body,open,id){return '<details class="fold"'+(open?' open':'')+(id?' id="'+id+'"':'')+'><summary>'+esc(title)+'</summary><div class="body">'+body+'</div></details>';}
function renderStatic(n){
  return n.c.map(function(x){
    if(x.h)return fold(x.h,renderStatic(x),false);
    if(x.t==='text')return '<p>'+md(x.v)+'</p>';
    if(x.t==='table')return tableOf(x.cols,x.rows);
    if(x.t==='bullets')return bullets(x.v);
    if(x.t==='links')return links(x.v);
    return '';
  }).join('');
}

function focusItem(it){
  if(!map||!it.geo)return;
  var cb=document.querySelector('input[data-layer="'+it.cat+'"]');if(cb&&!cb.checked){cb.checked=true;layers[it.cat].addTo(map);}
  document.getElementById('mapsec').scrollIntoView();
  map.setView([it.geo.lat+it.geo.dy,it.geo.lon+it.geo.dx],16);markers[it.id].openPopup();
}
function initMap(){
  var mapped=items.filter(function(i){return i.geo&&i.kind!=='over';});
  var vis=mapped.filter(function(i){return String(getMark(i.n))!=='3';});
  var n=vis.length,ex=vis.filter(function(i){return i.geo.exact;}).length;
  document.getElementById('mapNote').textContent='主清單、參考區、其他區共 '+n+' 筆有座標（超出預算與標記為不考慮的不含）：地址級 '+ex+' 筆（實心圓），其餘 '+(n-ex)+' 筆只有大約位置（虛線空心圓）。點標記看總價、格局、車位、來源與 Google 地圖連結；座標相同的物件在圖上略微錯開。';
  document.getElementById('legend').innerHTML=CATS.map(function(c,i){
    var k=vis.filter(function(m){return m.cat===i;}).length;
    return '<label style="--c:'+COLORS[i]+'"><input type="checkbox" checked data-layer="'+i+'"><span class="dot"></span>'+esc(c)+'（'+k+'）</label>';}).join('');
  if(typeof L==='undefined'){document.getElementById('map').innerHTML='<p style="padding:16px">地圖函式庫（Leaflet）無法載入，請確認網路連線；下方清單的「在 Google 地圖開啟」連結仍可使用。</p>';return;}
  map=L.map('map',{scrollWheelZoom:false}).setView([25.08,121.52],12);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors'}).addTo(map);
  CATS.forEach(function(){layers.push(L.layerGroup());});
  var grp={};
  mapped.forEach(function(it){var k=it.geo.lat+','+it.geo.lon;(grp[k]=grp[k]||[]).push(it);});
  var num=0;
  mapped.forEach(function(it){
    var k=it.geo.lat+','+it.geo.lon,arr=grp[k],j=arr.indexOf(it),m=arr.length;
    var ang=2*Math.PI*j/m,off=m>1?0.00028:0;
    it.geo.dx=off*Math.cos(ang);it.geo.dy=off*Math.sin(ang);
    num++;
    var icon=L.divIcon({className:'',html:'<div class="pin'+(it.geo.exact?'':' approx')+'" style="--c:'+COLORS[it.cat]+'">'+num+'</div>',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-12]});
    var mk=L.marker([it.geo.lat+it.geo.dy,it.geo.lon+it.geo.dx],{icon:icon,title:it.n}).bindPopup(function(){return popupHtml(it);},{maxWidth:300});
    mk.addTo(layers[it.cat]);markers[it.id]=mk;
  });
  layers.forEach(function(l){l.addTo(map);});
  var pts=mapped.map(function(i){return [i.geo.lat,i.geo.lon];});
  map.fitBounds(pts,{padding:[30,30]});
  map.on('click',function(){map.scrollWheelZoom.enable();});
  document.getElementById('legend').addEventListener('change',function(e){
    var c=e.target.getAttribute('data-layer');if(c===null)return;
    if(e.target.checked)layers[+c].addTo(map);else map.removeLayer(layers[+c]);});
}
initMap();

// ---- list ----
var DEFMARK=['想看','已看','未標記'];
var ST={dist:[],type:[],age:[],price:[],fit:[],mark:DEFMARK.slice(),sort:'default',q:'',view:'cards'};
var CHIPS={dist:['大安區','士林區','北投區'],type:['預售建案','新成屋／新古屋'],age:['預售（未入住）','0–5 年','5–10 年','10–15 年','超過 15 年','未列'],price:['4,000 萬以下','4,000–5,000 萬','5,000–6,000 萬','6,000 萬以上','總價未列'],fit:['符合','略超、可議價','部分符合','待確認'],mark:['想看','已看','不考慮','未標記']};
var CHIPID={dist:'fDist',type:'fType',age:'fAge',price:'fPrice',fit:'fFit',mark:'fMark'};
function drawChips(){Object.keys(CHIPS).forEach(function(k){document.getElementById(CHIPID[k]).innerHTML=CHIPS[k].map(function(o){return '<button type="button" class="chip" data-fk="'+k+'" data-fv="'+esc(o)+'" aria-pressed="'+(ST[k].indexOf(o)>=0?'true':'false')+'">'+esc(o)+'</button>';}).join('');});}
document.querySelector('.fgs').addEventListener('click',function(e){var b=e.target.closest('[data-fk]');if(!b)return;var k=b.getAttribute('data-fk'),v=b.getAttribute('data-fv'),i=ST[k].indexOf(v);if(i>=0)ST[k].splice(i,1);else ST[k].push(v);drawChips();renderList();});
drawChips();
function fillSel(id,opts,key){var el=document.getElementById(id);el.innerHTML=opts.map(function(o){var v=o.v!==undefined?o.v:o,l=o.l!==undefined?o.l:o;return '<option value="'+esc(v)+'">'+esc(l)+'</option>';}).join('');el.addEventListener('change',function(){ST[key]=el.value;renderList();});}
fillSel('fSort',[{v:'default',l:'預設（行政區）'},{v:'totalAsc',l:'總價 低到高'},{v:'totalDesc',l:'總價 高到低'},{v:'unit',l:'單價 低到高'},{v:'ageAsc',l:'屋齡 新到舊'},{v:'ageDesc',l:'屋齡 舊到新'}],'sort');
document.getElementById('fQ').addEventListener('input',function(e){ST.q=e.target.value;renderList();});
document.getElementById('vCards').addEventListener('click',function(){ST.view='cards';document.getElementById('vCards').classList.add('on');document.getElementById('vTable').classList.remove('on');renderList();});
document.getElementById('vTable').addEventListener('click',function(){ST.view='table';document.getElementById('vTable').classList.add('on');document.getElementById('vCards').classList.remove('on');renderList();});
document.getElementById('fReset').addEventListener('click',function(){
  ST.dist=[];ST.type=[];ST.age=[];ST.price=[];ST.fit=[];ST.mark=DEFMARK.slice();ST.sort='default';ST.q='';
  drawChips();document.getElementById('fSort').value='default';document.getElementById('fQ').value='';renderList();});
function cmpN(a,b,d){if(a==null&&b==null)return 0;if(a==null)return 1;if(b==null)return -1;return (a-b)*d;}
function syncMapMarks(){if(typeof L==='undefined'||!map)return;MAIN.concat(typeof ALLMAP!=='undefined'?[]:[]).forEach(function(i){var m=markers[i.id];if(!m)return;var lay=layers[i.cat];if(!lay)return;if(String(getMark(i.n))==='3'){if(lay.hasLayer(m))lay.removeLayer(m);}else if(!lay.hasLayer(m))lay.addLayer(m);});}
function renderPass(){var el=document.getElementById('passOut');if(!el)return;var ps=MAIN.filter(function(i){return String(getMark(i.n))==='3';});el.innerHTML=ps.length?'<div class="cards">'+ps.map(function(i){return card(i);}).join('')+'</div>':'<p class="note">目前沒有標記為不考慮的物件。</p>';}
function renderList(){setTimeout(syncMapMarks,0);renderPass();
  var list=MAIN.filter(function(i){
    var inG=function(k,v){return ST[k].length===0||ST[k].indexOf(v)>=0;};
    if(!inG('dist',i.d))return false;
    if(!inG('type',i.t==='預售'?'預售建案':'新成屋／新古屋'))return false;
    if(!inG('age',ageBucket(i)))return false;
    if(!inG('price',priceBucket(i)))return false;
    if(!inG('fit',i.fit))return false;
    if(!inG('mark',getMark(i.n)?MS[getMark(i.n)]:'未標記'))return false;
    if(ST.q.trim()&&(i.n+i.r).indexOf(ST.q.trim())<0)return false;
    return true;});
  if(ST.sort==='totalAsc')list=list.slice().sort(function(a,b){return cmpN(a.pmin,b.pmin,1);});
  if(ST.sort==='totalDesc')list=list.slice().sort(function(a,b){return cmpN(a.pmin,b.pmin,-1);});
  if(ST.sort==='unit')list=list.slice().sort(function(a,b){return cmpN(a.umin,b.umin,1);});
  if(ST.sort==='ageAsc')list=list.slice().sort(function(a,b){return cmpN(ageNum(a),ageNum(b),1);});
  if(ST.sort==='ageDesc')list=list.slice().sort(function(a,b){return cmpN(ageNum(a),ageNum(b),-1);});
  document.getElementById('listCount').textContent='顯示 '+list.length+' / '+MAIN.length+' 筆';
  var out=document.getElementById('listOut');
  if(!list.length){out.innerHTML='<p class="note">沒有符合篩選條件的物件。</p>';return;}
  if(ST.view==='cards'){out.innerHTML='<div class="cards">'+list.map(function(i){return card(i);}).join('')+'</div>';return;}
  out.innerHTML='<div class="tw"><table class="rt"><thead><tr>'+['名稱','行政區','類型','路段','生活圈','總價','單價','3 房坪數與格局','屋齡／完工','車位','預算','亮點與提醒','標記','來源','地圖'].map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>'+
   list.map(function(i){return '<tr><td class="n" data-label="名稱">'+(i.isNew?'<span class="badge new">新</span> ':'')+warnBadge(i)+' '+esc(i.n)+'</td><td data-label="行政區">'+esc(i.d)+'</td><td data-label="類型">'+typeLabel(i.t)+'</td><td data-label="路段">'+esc(i.r)+'</td><td data-label="生活圈">'+esc(D.circleOf[i.n]||'未列')+'</td><td data-label="總價">'+esc(i.price)+'</td><td data-label="單價">'+esc(i.unit)+'</td><td data-label="3 房坪數與格局">'+esc(i.size)+'</td><td data-label="屋齡／完工">'+esc(i.age)+'</td><td data-label="車位">'+esc(i.park)+'</td><td data-label="預算">'+esc(i.fit)+'</td><td data-label="亮點與提醒">'+esc(i.hi||'')+(BI(i)?'<br><b>'+esc(builderLine(i))+'</b><br>'+(BI(i).w?'⚠️ ':'')+esc(BI(i).i):'')+'</td><td data-label="標記">'+markBtns(i)+'</td><td data-label="來源">'+A(i.url,i.src)+'</td><td data-label="地圖">'+(i.geo?A(gmu(i.geo),'Google 地圖'+(i.geo.exact?'':'（大約）')):'未定位')+'</td></tr>';}).join('')+'</tbody></table></div>';
}
renderList();

// ---- picks ----
function renderPicks(){document.getElementById('picksCards').innerHTML=D.picks.map(function(n){var it=MAIN.filter(function(i){return i.n===n;})[0];return (it&&String(getMark(n))!=='3')?card(it):'';}).join('');}
renderPicks();

// ---- circles ----
function renderCircles(d){
  var cs=D.circles.filter(function(c){return c.d===d;});
  document.getElementById('circOut').innerHTML=cs.map(function(c){
    var names=MAIN.filter(function(i){return D.circleOf[i.n]===c.name;}).map(function(i){return i.n;}).concat(D.refs.filter(function(r){return r.c===c.name;}).map(function(r){return r.n+'（參考）';}));
    return '<div class="circ"><h4>'+esc(c.name)+'</h4>'+facts([['捷運站',c.mrt],['學區',c.edu],['醫院',c.med],['公園',c.park],['購物',c.shop],['交通',c.traffic],['優點',c.pros],['缺點',c.cons],['每坪實價',c.price],['對應物件',names.length?names.join('、'):'無']])+'<div class="links">'+A(c.url,c.src)+A(c.url2,c.src2)+'</div></div>';}).join('');
}
renderCircles('大安區');
document.getElementById('circTabs').addEventListener('click',function(e){var b=e.target.closest('[data-cd]');if(!b)return;
  Array.prototype.forEach.call(document.querySelectorAll('#circTabs .btn'),function(x){x.classList.remove('on');});b.classList.add('on');renderCircles(b.getAttribute('data-cd'));});
// open target folds from nav
function openHash(){var id=location.hash.slice(1);var el=id&&document.getElementById(id);if(el&&el.tagName==='DETAILS')el.open=true;}
window.addEventListener('hashchange',openHash);openHash();
})();
</script>
